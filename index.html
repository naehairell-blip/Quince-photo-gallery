<!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Quinceañera Photo Gallery</title>

      <!-- Supabase JS Library -->
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

      <style>
        body {
          font-family: system-ui, -apple-system, sans-serif;
          max-width: 800px;
          margin: 0 auto;
          padding: 20px;
          line-height: 1.5;
        }
        #upload {
          margin: 15px 0;
        }
        #status {
          margin: 10px 0;
          font-weight: bold;
        }
        #gallery {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap: 15px;
          margin-top: 20px;
        }
        #gallery img {
          width: 100%;
          height:250px;
          object-fit: cover;
          border-radius: 12px;
        }
      </style>
    </head>
    <body>
      <h1>Quinceañera Photo Gallery</h1>
      <p>Upload your photos below!</p>
      <input type="file" id="upload" accept="image/*">
      <div id="status"></div>
      <div id="gallery"></div>

      <script>
        const status = document.getElementById("status");

        const SUPABASE_URL = "https://tsyadfkwthcnvflsoinr.supabase.co";
        const SUPABASE_KEY = "sb_publishable_l9cupNWcrUKor17lW0H1bQ_jjRYHrBC";

        try{
          alert("1. start test");

          alert("2. supabase library: " + typeof window.supabase);

          alert("3. createClient:" + typeof window.supabase.createClient);

          const supabase = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
            );

          alert("4. client created");

          status.textContent = "supabase client is working";
        } catch (error) {
          alert("ERROR: " + error.message);
          status.textContent = "ERROR: " + error.message;
          console.error(error);
        }
      </script>
    </body>
  </html>
