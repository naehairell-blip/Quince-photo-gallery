<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quinceañera Photos</title>

  <!-- Elegant fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Montserrat:wght@400;500;600&family=Parisienne&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      color: #f8f1df;

      background:
        radial-gradient(
          circle at center center,
          #4d9476 0%,
          #3d8064 18%,
          #2d6b53 36%,
          #205540 55%,
          #123c2d 73%,
          #09291f 88%,
          #041a13 100%
        );

      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }


    /* =========================
       BACKGROUND HALF CIRCLES
       ========================= */

    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      border: 1px solid rgba(218, 177, 82, 0.24);
      border-radius: 50%;
      z-index: 0;
    }

    body::before {
      width: 520px;
      height: 520px;
      left: -350px;
      top: 8%;
    }

    body::after {
      width: 620px;
      height: 620px;
      right: -430px;
      bottom: 2%;
    }


    /* =========================
       MAIN PAGE
       ========================= */

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 35px 18px 55px;
      position: relative;
      z-index: 1;
    }


    /* =========================
       OUTER GOLD CORNERS
       ========================= */

    .outer-frame {
      width: 100%;
      max-width: 1050px;
      min-height: calc(100vh - 70px);
      margin: 0 auto;
      position: relative;

      padding: 24px;

      border: 1px solid rgba(221, 181, 87, 0.55);
    }

    .outer-frame::before,
    .outer-frame::after,
    .corner-top-right,
    .corner-bottom-left {

      content: "";
      position: absolute;

      width: 65px;
      height: 65px;

      pointer-events: none;
    }


    /* Top left */

    .outer-frame::before {
      left: -1px;
      top: -1px;

      border-left: 2px solid #dcb657;
      border-top: 2px solid #dcb657;
    }


    /* Bottom right */

    .outer-frame::after {
      right: -1px;
      bottom: -1px;

      border-right: 2px solid #dcb657;
      border-bottom: 2px solid #dcb657;
    }


    /* Top right */

    .corner-top-right {
      right: -1px;
      top: -1px;

      border-right: 2px solid #dcb657;
      border-top: 2px solid #dcb657;
    }


    /* Bottom left */

    .corner-bottom-left {
      left: -1px;
      bottom: -1px;

      border-left: 2px solid #dcb657;
      border-bottom: 2px solid #dcb657;
    }


    /* Inner corner lines */

    .inner-corners {
      position: absolute;
      inset: 8px;
      pointer-events: none;
      border: 1px solid rgba(220, 182, 87, 0.28);
    }


    /* =========================
       HEADER
       ========================= */

    .header {
      text-align: center;
      padding: 15px 10px 30px;
    }


    /* Small Edwardian-style title */

    .main-title {
      font-family: 'Parisienne', cursive;

      font-size: clamp(29px, 6vw, 42px);

      line-height: 1;
      font-weight: 400;

      color: #e0bd62;

      margin: 0 auto 18px;

      letter-spacing: 0.3px;

      text-shadow:
        0 1px 8px rgba(0,0,0,0.18);

      max-width: 90%;
    }


    .gold-rule {
      width: 155px;
      height: 1px;

      margin: 0 auto 18px;

      background: #dcb657;

      position: relative;
    }

    .gold-rule::before,
    .gold-rule::after {
      content: "";

      position: absolute;
      top: 50%;

      width: 7px;
      height: 7px;

      border: 1px solid #dcb657;

      transform: translateY(-50%) rotate(45deg);
    }

    .gold-rule::before {
      left: -10px;
    }

    .gold-rule::after {
      right: -10px;
    }


    /* =========================
       CREAM INVITATION PANEL
       ========================= */

    .invitation {
      position: relative;

      background:
        linear-gradient(
          145deg,
          #fffdf5 0%,
          #f8f0dd 100%
        );

      color: #244b3a;

      padding: 48px 25px 42px;

      border: 2px solid #d5ad51;

      box-shadow:
        0 0 0 7px rgba(221, 182, 88, 0.15),
        0 18px 45px rgba(0, 0, 0, 0.25);

      max-width: 900px;
      margin: 0 auto;
    }


    .invitation::before {
      content: "";

      position: absolute;
      inset: 7px;

      border: 1px solid rgba(182, 139, 53, 0.5);

      pointer-events: none;
    }


    /* =========================
       SECTION HEADINGS
       ========================= */

    .section-title {

      font-family: 'Bodoni Moda', serif;

      font-size: clamp(28px, 5vw, 43px);

      font-weight: 500;

      text-align: center;

      margin: 0 0 9px;

      color: #2e6950;

      letter-spacing: 0.3px;
    }


    .section-subtitle {

      text-align: center;

      font-family: 'Montserrat', sans-serif;

      font-size: 13px;

      color: #6d6758;

      margin: 0 0 30px;

      letter-spacing: 1.3px;
    }


    /* =========================
       UPLOAD AREA
       ========================= */

    .upload-box {

      text-align: center;

      padding: 24px 18px;

      border: 1px solid rgba(181, 143, 57, 0.6);

      background: rgba(255,255,255,0.45);

      margin-bottom: 42px;
    }


    .upload-button {

      display: inline-block;

      background: #2c6b51;

      color: #fffdf5;

      border: 1px solid #d4ad55;

      padding: 14px 28px;

      font-family: 'Montserrat', sans-serif;

      font-size: 13px;

      font-weight: 600;

      letter-spacing: 1.2px;

      cursor: pointer;

      transition: all 0.2s ease;

      box-shadow:
        0 5px 15px rgba(0,0,0,0.15);
    }


    .upload-button:hover {

      background: #21543f;

      transform: translateY(-1px);

      box-shadow:
        0 7px 18px rgba(0,0,0,0.2);
    }


    #photoInput {
      display: none;
    }


    #status {

      margin-top: 14px;

      font-size: 12px;

      color: #5f5a4d;

      min-height: 18px;
    }


    /* =========================
       GALLERY TITLE
       ========================= */

    .gallery-heading {

      font-family: 'Bodoni Moda', serif;

      font-size: clamp(26px, 5vw, 40px);

      font-weight: 500;

      color: #2e6950;

      text-align: center;

      margin: 0 0 7px;
    }


    .gallery-description {

      text-align: center;

      color: #716b5e;

      font-size: 12px;

      letter-spacing: 1px;

      margin: 0 0 27px;
    }


    /* =========================
       PHOTO GALLERY
       ========================= */

    #gallery {

      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));

      gap: 18px;
    }


    .photo-frame {

      background: #fffdf5;

      padding: 7px;

      border: 1px solid #cba64d;

      box-shadow:
        0 5px 16px rgba(0,0,0,0.16);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }


    .photo-frame:hover {

      transform: translateY(-3px);

      box-shadow:
        0 9px 22px rgba(0,0,0,0.22);
    }


    .photo-frame img {

      width: 100%;

      height: 250px;

      object-fit: cover;

      display: block;
    }


    /* =========================
       SMALL FOOTER
       ========================= */

    .footer {

      text-align: center;

      margin-top: 35px;

      font-size: 10px;

      letter-spacing: 1.5px;

      color: rgba(242, 221, 167, 0.75);
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .page {
        padding: 20px 10px 35px;
      }

      .outer-frame {
        padding: 17px;
        min-height: calc(100vh - 40px);
      }

      .invitation {
        padding: 38px 17px 35px;
      }

      .main-title {
        font-size: 31px;
        margin-bottom: 15px;
      }

      .section-title {
        font-size: 29px;
      }

      .gallery-heading {
        font-size: 28px;
      }

      #gallery {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 12px;
      }

      .photo-frame img {
        height: 190px;
      }

      .outer-frame::before,
      .outer-frame::after,
      .corner-top-right,
      .corner-bottom-left {
        width: 45px;
        height: 45px;
      }
    }

  </style>
</head>


<body>

  <div class="page">

    <div class="outer-frame">

      <div class="corner-top-right"></div>
      <div class="corner-bottom-left"></div>
      <div class="inner-corners"></div>


      <!-- HEADER -->

      <header class="header">

        <h1 class="main-title">
          Quinceañera Photos
        </h1>

        <div class="gold-rule"></div>

      </header>


      <!-- CREAM CENTER -->

      <main class="invitation">


        <!-- UPLOAD -->

        <section>

          <h2 class="section-title">
            Share Your Photos
          </h2>

          <p class="section-subtitle">
            Capture the memories and add them to the celebration
          </p>


          <div class="upload-box">

            <label
              for="photoInput"
              class="upload-button"
            >
              SELECT PHOTOS
            </label>

            <input
              type="file"
              id="photoInput"
              accept="image/*"
              multiple
            >

            <div id="status"></div>

          </div>

        </section>


        <!-- GALLERY -->

        <section>

          <h2 class="gallery-heading">
            Memories From The Celebration
          </h2>

          <p class="gallery-description">
            Photos shared by family and friends
          </p>

          <div id="gallery"></div>

        </section>


      </main>


      <div class="footer">
        A COLLECTION OF MEMORIES
      </div>

    </div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://tsyadfkwthcnvflsoinr.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_l9cupNWcrUKor17lW0H1bQ_jjRYHrBC";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const photoInput =
      document.getElementById("photoInput");

    const gallery =
      document.getElementById("gallery");

    const status =
      document.getElementById("status");


    /* =========================
       IMAGE COMPRESSION
       ========================= */

    function compressImage(file) {

      return new Promise((resolve) => {

        const img = new Image();

        const reader = new FileReader();


        reader.onload = function(event) {

          img.onload = function() {

            const maxWidth = 2000;
            const maxHeight = 2000;

            let width = img.width;
            let height = img.height;


            if (width > maxWidth) {

              height =
                height * (maxWidth / width);

              width = maxWidth;
            }


            if (height > maxHeight) {

              width =
                width * (maxHeight / height);

              height = maxHeight;
            }


            const canvas =
              document.createElement("canvas");

            canvas.width = width;
            canvas.height = height;


            const ctx =
              canvas.getContext("2d");

            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );


            canvas.toBlob(
              (blob) => {

                resolve(blob);

              },
              "image/jpeg",
              0.85
            );

          };


          img.src = event.target.result;

        };


        reader.readAsDataURL(file);

      });

    }


    /* =========================
       UPLOAD PHOTOS
       ========================= */

    photoInput.addEventListener(
      "change",
      async function() {

        const files =
          Array.from(photoInput.files);


        if (!files.length) {
          return;
        }


        status.textContent =
          `Uploading ${files.length} photo${files.length > 1 ? "s" : ""}...`;


        let uploaded = 0;


        for (
          let i = 0;
          i < files.length;
          i++
        ) {

          const file = files[i];


          try {

            const compressedFile =
              await compressImage(file);


            const filePath =
              "uploads/" +
              Date.now() +
              "-" +
              Math.random()
                .toString(36)
                .substring(2, 10) +
              "-" +
              i +
              ".jpg";


            const {
              error
            } =
              await supabaseClient
                .storage
                .from("Quince photos")
                .upload(
                  filePath,
                  compressedFile,
                  {
                    cacheControl: "3600",
                    contentType: "image/jpeg",
                    upsert: false
                  }
                );


            if (error) {

              console.error(
                "Upload error:",
                error
              );

              continue;
            }


            uploaded++;

          }

          catch (error) {

            console.error(
              "Photo error:",
              error
            );

          }

        }


        status.textContent =
          `${uploaded} photo${uploaded !== 1 ? "s" : ""} uploaded successfully!`;


        photoInput.value = "";


        loadGallery();

      }
    );


    /* =========================
       LOAD GALLERY
       ========================= */

    async function loadGallery() {

      gallery.innerHTML = "";


      const {
        data,
        error
      } =
        await supabaseClient
          .storage
          .from("Quince photos")
          .list(
            "uploads",
            {
              limit: 100,
              offset: 0,
              sortBy: {
                column: "created_at",
                order: "desc"
              }
            }
          );


      if (error) {

        console.error(
          "Gallery error:",
          error
        );

        return;
      }


      if (!data || data.length === 0) {

        gallery.innerHTML =
          "<p style='text-align:center; color:#777;'>No photos yet.</p>";

        return;
      }


      data.forEach((file) => {

        const filePath =
          "uploads/" + file.name;


        const {
          data: publicUrlData
        } =
          supabaseClient
            .storage
            .from("Quince photos")
            .getPublicUrl(filePath);


        const frame =
          document.createElement("div");

        frame.className =
          "photo-frame";


        const img =
          document.createElement("img");

        img.src =
          publicUrlData.publicUrl;

        img.alt =
          "Quinceañera photo";

        img.loading =
          "lazy";


        frame.appendChild(img);

        gallery.appendChild(frame);

      });

    }


    /* =========================
       INITIAL LOAD
       ========================= */

    loadGallery();

  </script>

</body>
</html>
