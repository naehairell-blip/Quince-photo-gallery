<!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Quinceañera Photo Gallery</title>

      <!-- Supabase JS Library -->
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

      <style>
        body {
          font-family: system-ui, -apple-system, sans-serif;
          max-width: 800px;
          margin: 0 auto;
          padding: 20px;
          line-height: 1.5;
        }
        #upload {
          margin: 15px 0;
        }
        #status {
          margin: 10px 0;
          font-weight: bold;
        }
        #gallery {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap: 15px;
          margin-top: 20px;
        }
        #gallery img {
          width: 100%;
          height:250px;
          object-fit: cover;
          border-radius: 12px;
        }
      </style>
    </head>
    <body>
      <h1>Quinceañera Photo Gallery</h1>
      <p>Upload your photos below!</p>
      <input type="file" id="upload" accept="image/*">
      <div id="status"></div>
      <div id="gallery"></div>

      <script>
        alert("THE SCRIPT IS RUNNING");
      </script>
    </body>
  </html>
